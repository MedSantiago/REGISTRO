<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a, #4c1d95, #2563eb);
      color: white;
      padding: 20px;
    }

    .card {
      width: 430px;
      max-width: 100%;
      padding: 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #e5e7eb;
      margin-bottom: 25px;
    }

    .alert {
      display: none;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 14px;
      text-align: center;
      font-size: 14px;
    }

    .alert.error {
      display: block;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      color: #fecaca;
    }

    .alert.success {
      display: block;
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid rgba(34, 197, 94, 0.5);
      color: #bbf7d0;
    }

    .group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid transparent;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.22);
      color: white;
      outline: none;
      font-size: 15px;
    }

    input::placeholder {
      color: #d1d5db;
    }

    input.error-input {
      border-color: #fb7185;
      background: rgba(239, 68, 68, 0.14);
    }

    .error-text {
      min-height: 18px;
      margin-top: 6px;
      color: #fecaca;
      font-size: 13px;
    }

    .password-box {
      position: relative;
    }

    .toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #bae6fd;
      font-size: 13px;
      user-select: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #22d3ee, #7c3aed);
      color: white;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px rgba(34, 211, 238, 0.3);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .login {
      margin-top: 22px;
      text-align: center;
      font-size: 14px;
    }

    a {
      color: #bae6fd;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <form class="card" id="registroForm">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Regístrate con tus datos</p>

    <div id="alert" class="alert"></div>

    <div class="group">
      <label for="nombre">Nombre completo</label>
      <input type="text" id="nombre" placeholder="Ej: Ana María Pérez" />
      <div class="error-text" id="nombreError"></div>
    </div>

    <div class="group">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" placeholder="Ej: 1087812026" maxlength="10" />
      <div class="error-text" id="usuarioError"></div>
    </div>

    <div class="group">
      <label for="correo">Correo electrónico</label>
      <input type="email" id="correo" placeholder="Ej: correo@ejemplo.com" />
      <div class="error-text" id="correoError"></div>
    </div>

    <div class="group">
      <label for="password">Contraseña</label>
      <div class="password-box">
        <input type="password" id="password" placeholder="Mínimo 6 caracteres" />
        <span class="toggle" id="togglePassword">Ver</span>
      </div>
      <div class="error-text" id="passwordError"></div>
    </div>

    <div class="group">
      <label for="confirmarPassword">Confirmar contraseña</label>
      <div class="password-box">
        <input type="password" id="confirmarPassword" placeholder="Repite tu contraseña" />
        <span class="toggle" id="toggleConfirmar">Ver</span>
      </div>
      <div class="error-text" id="confirmarPasswordError"></div>
    </div>

    <button type="submit" id="btnRegistro">Registrarme</button>

    <div class="login">
      ¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a>
    </div>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore.js";

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBVjIS25P3ihP9QjIAoENdDgylbZf0pg38",
  authDomain: "school-1fe57.firebaseapp.com",
  projectId: "school-1fe57",
  storageBucket: "school-1fe57.firebasestorage.app",
  messagingSenderId: "590985630383",
  appId: "1:590985630383:web:70e3bd527c32b4b9e87a5a",
  measurementId: "G-2LPW5Y9QSH"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("registroForm");
    const nombre = document.getElementById("nombre");
    const usuario = document.getElementById("usuario");
    const correo = document.getElementById("correo");
    const password = document.getElementById("password");
    const confirmarPassword = document.getElementById("confirmarPassword");

    const nombreError = document.getElementById("nombreError");
    const usuarioError = document.getElementById("usuarioError");
    const correoError = document.getElementById("correoError");
    const passwordError = document.getElementById("passwordError");
    const confirmarPasswordError = document.getElementById("confirmarPasswordError");

    const alertBox = document.getElementById("alert");
    const btnRegistro = document.getElementById("btnRegistro");
    const togglePassword = document.getElementById("togglePassword");
    const toggleConfirmar = document.getElementById("toggleConfirmar");

    togglePassword.addEventListener("click", () => cambiarVisibilidad(password, togglePassword));
    toggleConfirmar.addEventListener("click", () => cambiarVisibilidad(confirmarPassword, toggleConfirmar));

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      limpiarErrores();

      const nombreValue = nombre.value.trim();
      const usuarioValue = usuario.value.trim();
      const correoValue = correo.value.trim().toLowerCase();
      const passwordValue = password.value.trim();
      const confirmarValue = confirmarPassword.value.trim();

      let error = false;

      if (nombreValue === "") {
        mostrarError(nombre, nombreError, "El nombre es obligatorio.");
        error = true;
      } else if (nombreValue.length < 3) {
        mostrarError(nombre, nombreError, "El nombre debe tener mínimo 3 caracteres.");
        error = true;
      }

      if (usuarioValue === "") {
        mostrarError(usuario, usuarioError, "El usuario es obligatorio.");
        error = true;
      } else if (!/^[0-9]+$/.test(usuarioValue)) {
        mostrarError(usuario, usuarioError, "El usuario solo debe tener números.");
        error = true;
      } else if (usuarioValue.length !== 10) {
        mostrarError(usuario, usuarioError, "El usuario debe tener 10 dígitos.");
        error = true;
      }

      if (correoValue === "") {
        mostrarError(correo, correoError, "El correo es obligatorio.");
        error = true;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correoValue)) {
        mostrarError(correo, correoError, "Ingresa un correo válido.");
        error = true;
      }

      if (passwordValue === "") {
        mostrarError(password, passwordError, "La contraseña es obligatoria.");
        error = true;
      } else if (passwordValue.length < 6) {
        mostrarError(password, passwordError, "La contraseña debe tener mínimo 6 caracteres.");
        error = true;
      }

      if (confirmarValue === "") {
        mostrarError(confirmarPassword, confirmarPasswordError, "Debes confirmar la contraseña.");
        error = true;
      } else if (confirmarValue !== passwordValue) {
        mostrarError(confirmarPassword, confirmarPasswordError, "Las contraseñas no coinciden.");
        error = true;
      }

      if (error) return;

      btnRegistro.disabled = true;
      btnRegistro.textContent = "Creando cuenta...";

      let paso = "inicio";

      try {
        paso = "leyendo loginUsuarios en Firestore";
        const loginRef = doc(db, "loginUsuarios", usuarioValue);
        const loginSnap = await getDoc(loginRef);

        if (loginSnap.exists()) {
          mostrarError(usuario, usuarioError, "Este usuario ya está registrado.");
          btnRegistro.disabled = false;
          btnRegistro.textContent = "Registrarme";
          return;
        }

        paso = "creando usuario en Authentication";
        const userCredential = await createUserWithEmailAndPassword(auth, correoValue, passwordValue);
        const user = userCredential.user;

        paso = "guardando documento en usuarios";
        await setDoc(doc(db, "usuarios", user.uid), {
          uid: user.uid,
          nombre: nombreValue,
          usuario: usuarioValue,
          correo: correoValue,
          rol: "estudiante",
          creadoEn: serverTimestamp()
        });

        paso = "guardando documento en loginUsuarios";
        await setDoc(loginRef, {
          correo: correoValue,
          uid: user.uid,
          creadoEn: serverTimestamp()
        });

        mostrarAlerta("Cuenta creada correctamente. Redirigiendo al login...", "success");

        setTimeout(() => {
          window.location.href = "index.html";
        }, 1200);

      } catch (error) {
        console.error("ERROR COMPLETO FIREBASE:", error);
        const codigo = error.code || "sin-codigo";
        const mensaje = error.message || "sin mensaje";

        mostrarAlerta(`Error en paso: ${paso}. Código: ${codigo}. Mensaje: ${mensaje}`, "error");

        btnRegistro.disabled = false;
        btnRegistro.textContent = "Registrarme";
      }
    });

    function obtenerMensajeError(error) {
      switch (error.code) {
        case "auth/email-already-in-use":
          return "Ese correo ya está registrado.";
        case "auth/invalid-email":
          return "El correo no es válido.";
        case "auth/weak-password":
          return "La contraseña es muy débil. Usa mínimo 6 caracteres.";
        case "permission-denied":
          return "Firebase no permitió guardar el usuario. Revisa Firestore y sus reglas.";
        default:
          console.error(error);
          return "No se pudo crear la cuenta. Revisa Firebase y vuelve a intentar.";
      }
    }

    function cambiarVisibilidad(input, boton) {
      if (input.type === "password") {
        input.type = "text";
        boton.textContent = "Ocultar";
      } else {
        input.type = "password";
        boton.textContent = "Ver";
      }
    }

    function mostrarError(input, contenedor, mensaje) {
      input.classList.add("error-input");
      contenedor.textContent = mensaje;
    }

    function limpiarErrores() {
      const inputs = [nombre, usuario, correo, password, confirmarPassword];
      inputs.forEach(input => input.classList.remove("error-input"));

      nombreError.textContent = "";
      usuarioError.textContent = "";
      correoError.textContent = "";
      passwordError.textContent = "";
      confirmarPasswordError.textContent = "";
      alertBox.className = "alert";
      alertBox.textContent = "";
    }

    function mostrarAlerta(mensaje, tipo) {
      alertBox.textContent = mensaje;
      alertBox.className = "alert " + tipo;
    }
  </script>
</body>
</html>
